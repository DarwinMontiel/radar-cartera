# Data warehouse local + ejecución del pipeline:
#   docker compose up -d postgres
#   docker compose run --rm etl
# Reportes en ./reports · DW en postgresql://cartera:cartera@localhost:5433/cartera
# (5433 para no chocar con un PostgreSQL local; se cambia con CARTERA_PG_PUERTO)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cartera
      POSTGRES_PASSWORD: cartera
      POSTGRES_DB: cartera
    ports: ["127.0.0.1:${CARTERA_PG_PUERTO:-5433}:5432"]
    volumes: [dwdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartera -d cartera"]
      interval: 5s
      retries: 10

  etl:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      CARTERA_DATABASE_URL: postgresql+psycopg://cartera:cartera@postgres:5432/cartera
    entrypoint: ["sh", "-c"]
    command: ["cartera generate --out /tmp/raw && cartera run --raw /tmp/raw --out /reports"]
    volumes: ["./reports:/reports"]
    profiles: ["job"]

volumes:
  dwdata:
