name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Tipos · Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov --cov-report=term --cov-fail-under=90

  integration:
    name: Integración · PostgreSQL 16
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cartera
          POSTGRES_PASSWORD: cartera
          POSTGRES_DB: cartera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cartera" --health-interval 5s --health-retries 10
    env:
      CARTERA_DATABASE_URL: postgresql+psycopg://cartera:cartera@localhost:5432/cartera
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m integration -v
      - name: Pipeline completo contra PostgreSQL
        run: |
          cartera generate --out data/raw
          cartera run --raw data/raw --out reports --db "$CARTERA_DATABASE_URL"

  report:
    name: Generar tablero y reporte Excel
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: cartera generate --out data/raw --seed 42
      - run: cartera run --raw data/raw --out site
      - uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [report, integration]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
