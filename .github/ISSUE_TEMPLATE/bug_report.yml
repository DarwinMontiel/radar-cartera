name: Reporte de error
description: Un KPI, una regla de calidad o un reporte no se comporta como se espera
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: ¿Qué pasó?
      description: Comportamiento observado y esperado (incluye el KPI o regla afectada).
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. cartera generate --seed 42\n2. cartera run ..."
    validations: { required: true }
  - type: textarea
    id: manifest
    attributes:
      label: manifest.json de la ejecución
      render: json
