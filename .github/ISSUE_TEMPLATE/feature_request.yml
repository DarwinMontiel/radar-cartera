name: Nueva funcionalidad
description: Proponer un KPI, una regla de calidad, un reporte o una integración
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema u oportunidad
      description: ¿Qué pregunta del negocio o dolor operativo de cobranza resuelve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
