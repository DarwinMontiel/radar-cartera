[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radar-cartera"
version = "1.0.0"
description = "Pipeline ETL y analítica de cartera y cobranzas: calidad de datos, modelo estrella en PostgreSQL, KPIs, Power BI y reportes Excel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Darwin Montiel Mora", email = "darwinmontielm@gmail.com" }]
keywords = ["etl", "pandas", "postgresql", "power-bi", "dax", "data-quality", "cobranzas"]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "jinja2>=3.1",
    "typer>=0.12",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2"]

[project.scripts]
cartera = "radar_cartera.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_cartera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: requiere PostgreSQL (CARTERA_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning:openpyxl.*"]

[tool.coverage.run]
source = ["radar_cartera"]
omit = ["*/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "PT", "PD"]
# E501: el largo de línea lo gestiona `ruff format`.
ignore = ["E501", "S101", "B008", "RUF001", "RUF002", "RUF003", "PD010", "PD013"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311"]
"src/radar_cartera/synthetic.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
# pandas devuelve Any con frecuencia; el resto de --strict se mantiene.
warn_return_any = false
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
